server:
  port: 8080

spring:
  application:
    name: cineverse
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cineverse}
    username: ${DB_USERNAME:cineverse}
    password: ${DB_PASSWORD:cineverse_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    test-connection: false
  jackson:
    default-property-inclusion: non_null

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-change-this-1234567890}
    issuer: cineverse-api
    expiration-minutes: 120
  booking:
    seat-hold-minutes: 5
    sales-cutoff-minutes: 20
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:uploads/movies}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

logging:
  level:
    org.hibernate.SQL: WARN
